[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "turnstac"
version = "1.0.0"
description = "Idempotent static STAC 1.1 catalog pipeline for the Pielach topo-bathymetric LiDAR time series"
requires-python = ">=3.10"
# GDAL and OPALS come from the environment (OSGeo / opals install), not pip
dependencies = [
    "pystac>=1.10",
    "pyyaml",
]

[project.optional-dependencies]
validation = ["pystac[validation]"]
dev = ["pytest"]

[project.scripts]
turnstac = "stac.core.cli:main"
turnstac-pre-raster = "stac.pre.tac_raster:main"
turnstac-pre-pcl = "stac.pre.tac_pcl:main"
turnstac-pre-copc = "stac.pre.c_copc:main"
turnstac-template = "stac.utils.gen_full_template:main"

[tool.setuptools.packages.find]
include = ["stac*"]
