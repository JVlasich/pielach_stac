# Tool config template. Every value shown = built-in default; uncomment to change.
# Precedence: CLI > this file > defaults.
# One file hold all namespaces: each tool read own section, ignore rest quietly.
# `python -m stac.utils.gen_full_template cfg.yaml` writes bare version of this.

catalog:                   # python -m stac <root> [--config cfg.yaml]

  # -- root catalog identity --
  # id: pielach
  # title: Pielach River Topo-Bathymetric LiDAR Time Series
  # description: Automated STAC catalog of the processed Pielach campaign datasets.

  # -- paths --
  # root: null             # processed-datasets root holding campaign dirs; CLI positional beat it
  # out: null              # catalog output dir (default: <root>/catalog)

  # -- what gets built --
  # only: null             # glob over campaign dir names, e.g. "202[45]-*"; skip stale-collection sweep
  # force: false           # ignore idempotency gate, rebuild every item; use after registry/code change,
  #                        # best paired with only
  # thumbnails: true       # PNG thumbnail per raster item + per tiled point-cloud subcollection
  # minPoints: 1000        # drop point-cloud item below this pc:count
  # assetHrefs: absolute   # relative = catalog travels with data; thumbnail href always relative

  # -- policy: disk doesnt match expectation --
  # stale: warn            # item/collection whose file vanished: warn keep | remove | raise
  # unknownAssets: warn    # file matches no registry pattern: warn | skip | raise
  # nonCloudNative: warn   # file with no COG/COPC twin: warn | skip | raise (skip = cloud-native-only catalog)
  # invalidCog: demote    # raster fails the COG structure validator: warn keep | demote to plain GeoTIFF | raise
  # idCollisions: warn     # same item/subcollection id in two campaigns: warn keep first owner | raise.
  #                        # collection id, and any collision inside one campaign, always raises

  # -- point statistics (opals) --
  # nbThreads: null        # null = opals default = all CPU
  # exactComputation: true # full scan: pc:statistics + real item datetime.
  #                        # false = header only, fast, no statistics, datetime fall back to campaign date

  # -- debug --
  # dryRun: false          # discover + gate only, report counts, write nothing
  # validate: false        # STAC-validate after save; needs pystac[validation]

  # -- root metadata. license AND providers both set = root promoted Catalog -> Collection --
  # license: null          # SPDX id, or "other"
  # licenseLink: null      # rel=license link; "other" without link = spec grumble
  # providers: null        # STAC list form:
  #   - name: TU Wien, Department of Geodesy and Geoinformation
  #     roles: [processor, host]
  #     url: https://www.tuwien.at/mg/geo
  #                        # or short name-keyed form:
  #   TU Wien, Department of Geodesy and Geoinformation:
  #     roles: [processor, host]
  #     url: https://www.tuwien.at/mg/geo


# --- pre-scripts --- arent called automatically, just convenient to have
tile_and_convert_pcl:      # python -m stac.pre.tac_pcl  -- LAZ -> laz tiles -> COPC
  # infile: null           # LAZ file(s) and/or dir(s), list allowed
  # outdir: null           # single input: exact dir. multiple: one subdir per input
  # tileSize: 500          # tile edge in map units
  # pointOrigin: null      # tile grid origin, e.g. "529000;5340000"; null = derive from data
  # buffer: 0              # tile overlap in map units; keep 0 while mergeBelow live, else merged
  #                        # tile carry duplicate points
  # mergeBelow: 100.0      # tile under this size (MB) glued into neighbour tile; 0 disable
  # tileSize_odm: 20.0     # inner tile size for opalsImport, unrelated to output tiling
  # nbThreads: null        # null = opals default = all CPU
  # distribute: null       # opals distribution factor
  # tmp_path: ./tmp        # scratch dir for ODM + intermediate tiles
  # keepodm: true          # keep ODM after run; false = re-import next run
  # keeptmp: false         # keep whole tmp dir

tac_raster:                # python -m stac.pre.tac_raster  -- GeoTIFF -> COG (tiling possible)
  # infile: null           # GeoTIFF file(s) and/or dir(s), multiple allowed
  # outdir: null           # COG-only input: file lands inside. tiled input: one subdir per input
  # minTileSize: null      # GB on disk that trigger tiling; null = plain COG for all inputs
  # tileSize: 16384        # tile edge in pixel, tiling path only
  # skipIfExists: true     # existing output not touched; false = redo everything
  # compress: DEFLATE      # COG compression, e.g. DEFLATE | LZW | ZSTD | NONE
  # blockSize: 512         # COG internal block edge in pixel
  # overviews: AUTO        # COG overview build mode
  # numThreads: ALL_CPUS   # GDAL NUM_THREADS
  # bigTiff: IF_SAFER      # BIGTIFF mode
